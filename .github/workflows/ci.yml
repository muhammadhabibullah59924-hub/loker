# CI dirender dari SPEC.json (stack.ecosystems dan stack.commands).
# Perintah harus identik dengan docs/EVALS.md, docs/TESTING.md, dan AGENTS.md.
# Periksa versi action terbaru tiap semester; untuk produksi pin action ke SHA commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: latest  # sesuaikan dengan versi yang dipakai proyek
      - name: Instal dependensi
        run: composer install
      - name: Persiapan lingkungan CI
        run: cp .env.example .env && php artisan key:generate
      - name: Lint
        run: vendor/bin/pint --test
      - name: Tes
        run: php artisan test
      - name: Build
        run: composer install --no-dev --optimize-autoloader
